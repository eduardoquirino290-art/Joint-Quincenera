<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#210000" />
    <title>Yathzircy Quirino &amp; Alexandra Garcia | Quinceañera</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="invitation">
      <div class="border border-outer" aria-hidden="true"></div>
      <div class="border border-inner" aria-hidden="true"></div>
      <div class="butterflies" aria-hidden="true">
        <svg class="butterfly butterfly-one" viewBox="0 0 100 80"><path d="M49 39C35 7 8 5 9 29c1 19 23 22 39 14M51 39C65 7 92 5 91 29c-1 19-23 22-39 14M50 38c-6 12-4 24 1 34M47 72h7M49 43l-5-7M52 43l5-7" /></svg>
        <svg class="butterfly butterfly-two" viewBox="0 0 100 80"><path d="M49 39C35 7 8 5 9 29c1 19 23 22 39 14M51 39C65 7 92 5 91 29c-1 19-23 22-39 14M50 38c-6 12-4 24 1 34M47 72h7M49 43l-5-7M52 43l5-7" /></svg>
        <svg class="butterfly butterfly-three" viewBox="0 0 100 80"><path d="M49 39C35 7 8 5 9 29c1 19 23 22 39 14M51 39C65 7 92 5 91 29c-1 19-23 22-39 14M50 38c-6 12-4 24 1 34M47 72h7M49 43l-5-7M52 43l5-7" /></svg>
        <svg class="butterfly butterfly-four" viewBox="0 0 100 80"><path d="M49 39C35 7 8 5 9 29c1 19 23 22 39 14M51 39C65 7 92 5 91 29c-1 19-23 22-39 14M50 38c-6 12-4 24 1 34M47 72h7M49 43l-5-7M52 43l5-7" /></svg>
        <svg class="butterfly butterfly-five" viewBox="0 0 100 80"><path d="M49 39C35 7 8 5 9 29c1 19 23 22 39 14M51 39C65 7 92 5 91 29c-1 19-23 22-39 14M50 38c-6 12-4 24 1 34M47 72h7M49 43l-5-7M52 43l5-7" /></svg>
      </div>
      <section class="hero" aria-labelledby="names">
        <svg class="crown" viewBox="0 0 100 78" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 49 10 18l24 18L50 8l16 28 24-18-8 31Z" />
            <path d="M18 49h64v10H18zM23 65h54" />
            <circle cx="10" cy="14" r="4" /><circle cx="34" cy="32" r="4" /><circle cx="50" cy="5" r="4" /><circle cx="66" cy="32" r="4" /><circle cx="90" cy="14" r="4" />
          </g>
        </svg>
        <h1 id="names"><span>Yathzircy Quirino</span><em>&amp;</em><span>Alexandra Garcia</span></h1>
        <div class="ornament" aria-hidden="true"><i></i><b>✧</b><i></i></div>
        <p class="eyebrow">A joint quinceañera celebration</p>
        <p class="date">October 23, 2027</p>
        <button class="rsvp-button" type="button" data-open-rsvp><span>♛</span> RSVP <span>♛</span></button>
      </section>
    </main>

    <dialog class="rsvp-dialog" aria-labelledby="rsvp-title">
      <button class="close" type="button" aria-label="Close RSVP form" data-close-rsvp>×</button>
      <p class="eyebrow">You are invited</p>
      <h2 id="rsvp-title">RSVP</h2>
      <form method="dialog">
        <label>Full name <input required name="name" autocomplete="name" /></label>
        <label>Guests attending <select name="guests"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
        <button class="submit" value="confirm">Send response</button>
      </form>
    </dialog>
    <script src="script.js"></script>
  </body>
</html>
