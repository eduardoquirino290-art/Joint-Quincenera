<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quinceañera Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#160102;color:#f8ead0;font-family:Poppins,sans-serif}main{max-width:1100px;margin:auto;padding:30px 18px}h1,h2{font-family:Cinzel,serif;color:#e7c95b}h1{text-align:center}section{background:#300303;border:1px solid #a77c13;border-radius:12px;padding:24px;margin:20px 0;box-shadow:0 15px 35px #0008}input,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:6px;border:1px solid #96700d;background:#1e0202;color:#fff;font:inherit}button{background:linear-gradient(#fff0a0,#d4af37,#9b7000);color:#240000;font-weight:700;cursor:pointer}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;text-align:center;border:1px solid #8f6b0d;border-radius:8px}.stat b{display:block;font-size:28px;color:#f1d66b}.rsvp{border-top:1px solid #76570b;padding:15px 0}.danger{background:#7b1111;color:#fff}.photo-row{display:flex;gap:10px;align-items:center}.photo-row img{width:100px;height:75px;object-fit:cover;border:1px solid #d4af37}.logout{max-width:160px}@media(max-width:600px){.stats{grid-template-columns:1fr}.photo-row{flex-direction:column;align-items:stretch}}
</style></head><body><main>
<h1>♛ Quinceañera Admin ♛</h1>
<section id="login"><h2>Private Login</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">LOGIN</button><p id="loginMsg"></p></section>
<div id="app" class="hidden">
<button class="logout" id="logoutBtn">LOG OUT</button>
<section><h2>RSVP Dashboard</h2><div class="stats"><div class="stat"><b id="total">0</b>Total RSVPs</div><div class="stat"><b id="yes">0</b>Attending</div><div class="stat"><b id="guests">0</b>Total Guests</div></div><div id="rsvps"></div></section>
<section><h2>Website Details</h2><input id="venueTitle" placeholder="Venue title"><textarea id="venueText" placeholder="Venue details"></textarea><button id="saveSite">SAVE WEBSITE DETAILS</button><p id="siteMsg"></p></section>
<section><h2>Gallery</h2><input id="photoFile" type="file" accept="image/*"><input id="photoAlt" placeholder="Photo description"><button id="uploadPhoto">UPLOAD PHOTO</button><div id="photos"></div><p id="photoMsg"></p></section>
</div></main>
<script type="module">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
const SUPABASE_URL="https://jabptlvotgyszohmqjw.supabase.co",SUPABASE_ANON_KEY="sb_publishable_";
const sb=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const $=id=>document.getElementById(id);
$("loginBtn").onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){$("loginMsg").textContent=error.message;return}showApp()};
$("logoutBtn").onclick=async()=>{await sb.auth.signOut();location.reload()};
async function showApp(){const {data:{session}}=await sb.auth.getSession();if(!session)return;$("login").classList.add("hidden");$("app").classList.remove("hidden");loadAll()}
async function loadAll(){await loadRsvps();await loadSite();await loadPhotos()}
async function loadRsvps(){const {data,error}=await sb.from("rsvps").select("*").order("created_at",{ascending:false});if(error){$("rsvps").textContent=error.message;return}$("total").textContent=data.length;$("yes").textContent=data.filter(x=>x.attendance==="Yes").length;$("guests").textContent=data.reduce((n,x)=>n+(Number(x.guests)||0),0);$("rsvps").innerHTML=data.map(x=>`<div class="rsvp"><b>${esc(x.name)}</b> — ${esc(x.attendance)} — ${x.guests||0} guest(s)<br><small>${esc(x.email)}${x.message?" — "+esc(x.message):""}</small><br><button class="danger" onclick="deleteRsvp('${x.id}')">DELETE</button></div>`).join("")}
window.deleteRsvp=async id=>{if(!confirm("Delete this RSVP?"))return;await sb.from("rsvps").delete().eq("id",id);loadRsvps()}
async function loadSite(){const {data}=await sb.from("site_settings").select("*").eq("id",1).maybeSingle();if(data){$("venueTitle").value=data.venue_title||"";$("venueText").value=data.venue_text||""}}
$("saveSite").onclick=async()=>{const {error}=await sb.from("site_settings").upsert({id:1,venue_title:$("venueTitle").value,venue_text:$("venueText").value});$("siteMsg").textContent=error?error.message:"Saved!"}
$("uploadPhoto").onclick=async()=>{const f=$("photoFile").files[0];if(!f)return;$("photoMsg").textContent="Uploading...";const path=crypto.randomUUID()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_");const up=await sb.storage.from("quinceanera-photos").upload(path,f);if(up.error){$("photoMsg").textContent=up.error.message;return}const {data:url}=sb.storage.from("quinceanera-photos").getPublicUrl(path);const {error}=await sb.from("photos").insert({url:url.publicUrl,storage_path:path,alt_text:$("photoAlt").value});$("photoMsg").textContent=error?error.message:"Photo uploaded!";$("photoFile").value="";loadPhotos()}
async function loadPhotos(){const {data}=await sb.from("photos").select("*").order("created_at",{ascending:false});$("photos").innerHTML=(data||[]).map(p=>`<div class="photo-row"><img src="${p.url}"><button class="danger" onclick="deletePhoto('${p.id}','${encodeURIComponent(p.storage_path||"")}')">DELETE</button></div>`).join("")}
window.deletePhoto=async(id,path)=>{if(!confirm("Delete photo?"))return;if(path)await sb.storage.from("quinceanera-photos").remove([decodeURIComponent(path)]);await sb.from("photos").delete().eq("id",id);loadPhotos()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
showApp();
</script></body></html>
