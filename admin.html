<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quinceañera Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#160102;color:#f8ead0;font-family:Poppins,sans-serif}main{max-width:1100px;margin:auto;padding:30px 18px}h1,h2{font-family:Cinzel,serif;color:#e7c95b}h1{text-align:center}section{background:#300303;border:1px solid #a77c13;border-radius:12px;padding:24px;margin:20px 0;box-shadow:0 15px 35px #0008}input,textarea,button{width:100%;padding:12px;margin:7px 0;border-radius:6px;border:1px solid #96700d;background:#1e0202;color:#fff;font:inherit}button{background:linear-gradient(#fff0a0,#d4af37,#9b7000);color:#240000;font-weight:700;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.hidden{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:18px;text-align:center;border:1px solid #8f6b0d;border-radius:8px}.stat b{display:block;font-size:28px;color:#f1d66b}.rsvp{border-top:1px solid #76570b;padding:15px 0}.danger{background:#7b1111;color:#fff}.photo-row{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #76570b}.photo-row img{width:100px;height:75px;object-fit:cover;border:1px solid #d4af37}.logout{max-width:160px}.muted{opacity:.75;font-size:.9rem}.ok{color:#e6c957}.error{color:#ff9a9a}@media(max-width:600px){.stats{grid-template-columns:1fr}.photo-row{flex-direction:column;align-items:stretch}}
</style>
</head>
<body><main>
<h1>♛ Quinceañera Admin ♛</h1>
<section id="login"><h2>Private Login</h2><input id="email" type="email" placeholder="Admin email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn">LOGIN</button><p id="loginMsg"></p></section>
<div id="app" class="hidden">
<button class="logout" id="logoutBtn">LOG OUT</button>
<p class="muted">Signed in as <span id="signedInAs"></span></p>
<section><h2>RSVP Dashboard</h2><div class="stats"><div class="stat"><b id="total">0</b>Total RSVPs</div><div class="stat"><b id="yes">0</b>Attending</div><div class="stat"><b id="guests">0</b>Total Guests</div></div><div id="rsvps"></div></section>
<section><h2>Website Details</h2><input id="venueTitle" placeholder="Venue title"><textarea id="venueText" rows="5" placeholder="Venue details"></textarea><button id="saveSite">SAVE WEBSITE DETAILS</button><p id="siteMsg"></p></section>
<section><h2>Gallery</h2><input id="photoFile" type="file" accept="image/*"><input id="photoTitle" placeholder="Photo description"><button id="uploadPhoto">UPLOAD PHOTO</button><p class="muted">Maximum image size: 10 MB.</p><div id="photos"></div><p id="photoMsg"></p></section>
</div></main>
<script type="module">
/* FIREBASE CONFIG — replace the values below with the config from your Firebase web app. */
const firebaseConfig={
  apiKey:"YOUR_API_KEY",
  authDomain:"YOUR_PROJECT_ID.firebaseapp.com",
  projectId:"YOUR_PROJECT_ID",
  storageBucket:"YOUR_STORAGE_BUCKET",
  messagingSenderId:"YOUR_MESSAGING_SENDER_ID",
  appId:"YOUR_APP_ID"
};

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import { getFirestore, collection, getDocs, getDoc, doc, query, orderBy, addDoc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js";

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const $=id=>document.getElementById(id);
const clean=v=>String(v??"").replace(/[&<>'"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;","\"":"&quot;"}[c]));

$("loginBtn").onclick=async()=>{
  $("loginMsg").textContent="Signing in...";
  try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value);}
  catch(e){console.error(e);$("loginMsg").textContent=friendlyError(e);}
};
$("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async user=>{
  if(!user){$("login").classList.remove("hidden");$("app").classList.add("hidden");return;}
  $("login").classList.add("hidden");$("app").classList.remove("hidden");$("signedInAs").textContent=user.email||"Admin";
  await loadAll();
});

async function loadAll(){await loadRsvps();await loadSite();await loadPhotos();}

async function loadRsvps(){
  const box=$("rsvps");box.textContent="Loading...";
  try{
    const snap=await getDocs(query(collection(db,"rsvps"),orderBy("createdAt","desc")));
    const data=snap.docs.map(d=>({id:d.id,...d.data()}));
    $("total").textContent=data.length;$("yes").textContent=data.filter(x=>x.attendance==="Yes").length;$("guests").textContent=data.reduce((n,x)=>n+(Number(x.guests)||0),0);
    box.innerHTML=data.length?data.map(x=>`<div class="rsvp"><b>${clean(x.name)}</b> — ${clean(x.attendance)} — ${Number(x.guests)||0} guest(s)<br><small>${clean(x.email)}${x.message?" — "+clean(x.message):""}</small><br><button class="danger" data-delete-rsvp="${x.id}">DELETE</button></div>`).join(""):"<p class='muted'>No RSVPs yet.</p>";
    box.querySelectorAll("[data-delete-rsvp]").forEach(btn=>btn.onclick=()=>deleteRsvp(btn.dataset.deleteRsvp));
  }catch(e){console.error(e);box.innerHTML=`<p class="error">${clean(friendlyError(e))}</p>`;}
}
async function deleteRsvp(id){if(!confirm("Delete this RSVP?"))return;try{await deleteDoc(doc(db,"rsvps",id));await loadRsvps();}catch(e){alert(friendlyError(e));}}

async function loadSite(){
  try{const snap=await getDoc(doc(db,"site_settings","main"));if(snap.exists()){const d=snap.data();$("venueTitle").value=d.venue_title||"";$("venueText").value=d.venue_text||"";}}
  catch(e){$("siteMsg").textContent=friendlyError(e);}
}
$("saveSite").onclick=async()=>{try{await setDoc(doc(db,"site_settings","main"),{venue_title:$("venueTitle").value.trim(),venue_text:$("venueText").value.trim(),updatedAt:new Date()});$("siteMsg").textContent="Saved!";}catch(e){$("siteMsg").textContent=friendlyError(e);}};

$("uploadPhoto").onclick=async()=>{
  const file=$("photoFile").files[0];if(!file)return alert("Choose an image first.");
  if(file.size>10*1024*1024)return alert("That image is larger than 10 MB.");
  $("photoMsg").textContent="Uploading...";
  try{
    const safe=file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
    const path=`gallery/${crypto.randomUUID()}-${safe}`;
    const storageRef=ref(storage,path);
    await uploadBytes(storageRef,file,{contentType:file.type});
    const url=await getDownloadURL(storageRef);
    await addDoc(collection(db,"photos"),{title:$("photoTitle").value.trim(),url,path,createdAt:new Date()});
    $("photoFile").value="";$("photoTitle").value="";$("photoMsg").textContent="Photo uploaded!";await loadPhotos();
  }catch(e){console.error(e);$("photoMsg").textContent=friendlyError(e);}
};

async function loadPhotos(){
  try{
    const snap=await getDocs(query(collection(db,"photos"),orderBy("createdAt","desc")));
    $("photos").innerHTML=snap.docs.length?snap.docs.map(d=>{const p=d.data();return `<div class="photo-row"><img src="${clean(p.url)}" alt="${clean(p.title||"Photo")}"><div style="flex:1"><b>${clean(p.title||"Gallery photo")}</b><button class="danger" data-delete-photo="${d.id}" data-path="${clean(p.path||"")}">DELETE</button></div></div>`}).join(""):"<p class='muted'>No photos yet.</p>";
    $("photos").querySelectorAll("[data-delete-photo]").forEach(btn=>btn.onclick=()=>deletePhoto(btn.dataset.deletePhoto,btn.dataset.path));
  }catch(e){$("photos").innerHTML=`<p class="error">${clean(friendlyError(e))}</p>`;}
}
async function deletePhoto(id,path){if(!confirm("Delete this photo?"))return;try{if(path)await deleteObject(ref(storage,path));await deleteDoc(doc(db,"photos",id));await loadPhotos();}catch(e){alert(friendlyError(e));}}

function friendlyError(e){const c=e?.code||"";if(c.includes("auth/invalid-credential")||c.includes("auth/wrong-password")||c.includes("auth/user-not-found"))return"Incorrect email or password.";if(c.includes("permission-denied"))return"Permission denied. Make sure your UID is added to the admins collection.";if(c.includes("unauthorized"))return"Firebase Storage permission denied. Check Storage Rules.";if(c.includes("network-request-failed"))return"Network error. Check your internet connection.";return e?.message||"Something went wrong.";}
</script>
</body></html>
